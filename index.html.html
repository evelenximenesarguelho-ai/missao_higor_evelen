const app=document.getElementById("app");
function screen(title,text,buttons="",photoOn=false){
 app.innerHTML=`<div class="badge">MISSÃO ESPECIAL • ARQUIVO DE HIGOR</div>
 <h2>${title}</h2>${photoOn?`<img class="photo" src="${photo}">`:``}
 <p>${text}</p>${buttons}`;
}
function start(){
 screen("A Próxima Fase",
 "HIGOR RAPHAEL, uma nova missão foi desbloqueada. Ela não envolve armas, inimigos ou mapas. Envolve a pessoa que esteve ao seu lado nas últimas seis fases.",
 `<button onclick="fase1()">INICIAR MISSÃO</button>`);
}
function fase1(){
 screen("FASE 1 — EVIDÊNCIA",
 "O jogo encontrou uma lembrança importante. Seis meses de histórias, risadas, desafios e momentos que fizeram duas pessoas se escolherem.",
 `<button onclick="fase2()">VER MEMÓRIA</button>`,true);
}
function fase2(){
 screen("FASE 2 — O QUE REALMENTE IMPORTA",
 "Nem todas as fases foram fáceis. Vocês tiveram altos e baixos. Mas, em vez de apagar a história, cada dificuldade ensinou vocês a se conhecerem e fortaleceu o casal.",
 `<button onclick="fase3()">ACEITAR O DESAFIO ❤️</button>`);
}
function fase3(){
 screen("FASE 3 — ESCOLHA DO JOGADOR",
 "Quando a fase fica difícil, existem duas opções: desistir ou continuar lutando juntos.",
 `<button onclick="fim()">CONTINUAR JUNTOS ❤️</button>
  <button onclick="fase3()">DESISTIR DA MISSÃO</button>`);
}
function fim(){
 screen("FASE FINAL — HIGOR RAPHAEL",
 "Evelen tem uma última mensagem para você. Não é uma promessa de uma vida perfeita. É uma escolha: viver as próximas fases ao seu lado, construir uma família e enfrentar o que vier juntos.",
 `<button onclick="pedido()">ABRIR ÚLTIMA MENSAGEM 💌</button>`);
}
function pedido(){
 app.innerHTML=`<div class="center">
 <div class="badge">MISSÃO FINAL • EVELEN → HIGOR RAPHAEL</div>
 <img class="photo" src="${photo}">
 <p>“Higor, em seis meses nós já vivemos tanta coisa. Tivemos momentos maravilhosos e também momentos difíceis. E tudo isso me mostrou que eu não quero alguém apenas para os dias bons. Eu quero você para construir comigo também nos dias difíceis.</p>
 <p>Eu não sei tudo que o futuro vai trazer, mas sei com quem eu quero viver esse futuro.</p>
 <p><strong>Eu escolho você. E quero continuar escolhendo você todos os dias.</strong> ❤️</p>
 <div class="big gold">💍 VOCÊ QUER CASAR COMIGO?</div>
 <button onclick="sim()">❤️ SIM — DESBLOQUEAR NOSSO FUTURO</button>
 <button onclick="pedido()">🔄 LER NOVAMENTE</button>
 </div>`;
}
function sim(){
 app.innerHTML=`<div class="center">
 <div class="badge">🏆 CONQUISTA DESBLOQUEADA</div>
 <h1 class="gold">MEU MARIDO ❤️</h1>
 <img class="photo" src="${photo}">
 <p>Parabéns, Higor Raphael.</p>
 <p><strong>Nova missão:</strong> construir uma vida juntos.</p>
 <p>De todas as fases que ainda vamos jogar, essa é a que eu mais quero viver com você.</p>
 <div class="big">❤️ 💍 ❤️</div>
 </div>`;
}
start();
